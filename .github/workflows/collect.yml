name: collect

# GitHub's scheduler is "best effort": runs can start late or be skipped, and
# a new schedule can take hours to start. So each run is a long job that takes
# a snapshot every 10 minutes by itself for ~5.5 hours. The schedule (and a
# queued run waiting behind the current one) only has to start a new job
# when the previous one ends, and as a backup every run starts the next one
# itself before it finishes. To stop collecting: Actions tab -> collect ->
# "..." -> Disable workflow.

on:
  schedule:
    - cron: "17 * * * *"      # hourly; while a job is running, the next one waits in the queue
  workflow_dispatch:          # start by hand from the Actions tab

concurrency:
  group: collector
  cancel-in-progress: false   # never stop a running collector; the next run waits

permissions:
  contents: write
  actions: write              # lets a run start the next one

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # GitHub's limit is 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Libraries for the website forecast. If this fails, collection still runs.
      - name: Install forecast libraries
        continue-on-error: true
        run: pip install -q -r app/requirements.txt

      - name: Collect every 10 minutes for ~5.5 hours
        run: |
          git config user.name  "youbike-collector"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git rebase --abort 2>/dev/null || true      # never stay stuck in a half-finished sync
            python collector/collect.py || echo "::warning::a source failed at $(date -u +%H:%M)Z (see manifest)"
            # refresh the website forecast; never allowed to stop collection
            timeout 240 python web/make_forecast.py || echo "::warning::website forecast not updated at $(date -u +%H:%M)Z"
            git add data/ docs/data/
            if ! git diff --cached --quiet; then
              git commit -q -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
              # If someone else changed the same file (e.g. docs/data/forecast.json), keep the
              # collector's newer version (-X theirs). A failed sync is undone so the next
              # loop starts clean; unpushed snapshots are pushed with the next one.
              for i in 1 2 3 4 5; do
                if git pull -q --rebase -X theirs && git push -q; then break; fi
                git rebase --abort 2>/dev/null || true
                echo "::warning::push failed, retry $i"; sleep $((i * 5))
              done
            fi
            # sleep until the next 10-minute mark
            now=$(date +%s)
            sleep $(( 600 - now % 600 ))
          done

      - name: Start the next run (backup for a late scheduler)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main -R "$GITHUB_REPOSITORY"
