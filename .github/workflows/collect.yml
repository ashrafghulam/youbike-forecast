name: collect

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may start a run a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

# Never run two collections at once; a late run waits instead of colliding.
concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch snapshots
        id: fetch
        run: python collector/collect.py
        continue-on-error: true   # still save what succeeded; status checked at the end

      - name: Commit new data
        if: always()
        run: |
          git config user.name  "youbike-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing new to commit"; exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet && git push --quiet && exit 0
            echo "push failed, retry $i"; sleep $((i * 5))
          done
          exit 1

      - name: Mark run failed if any source failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "At least one source failed this run (see manifest)."
          exit 1
